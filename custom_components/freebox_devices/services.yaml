definir_plage_horaire:
  name: Définir une plage horaire (contrôle parental)
  description: >-
    Modifie le planning d'un profil de contrôle parental Freebox sur une
    plage horaire précise, certains jours de la semaine (les autres
    créneaux du planning ne sont pas touchés).
  fields:
    entity_id:
      name: Profil
      description: >-
        Entité "État" ou "Mode" du profil concerné (Paramètres > Appareils
        et services > Freebox Devices > le profil voulu).
      required: true
      selector:
        entity:
          integration: freebox_devices
    jours:
      name: Jours
      description: Jours de la semaine concernés.
      required: true
      selector:
        select:
          multiple: true
          options:
            - lundi
            - mardi
            - mercredi
            - jeudi
            - vendredi
            - samedi
            - dimanche
    heure_debut:
      name: Heure de début
      required: true
      selector:
        time:
    heure_fin:
      name: Heure de fin
      required: true
      selector:
        time:
    mode:
      name: Mode
      description: État d'accès à appliquer sur cette plage.
      required: true
      selector:
        select:
          options:
            - label: Autorisé
              value: allowed
            - label: Bloqué
              value: denied
            - label: Web uniquement
              value: webonly

couper_acces_web:
  name: Couper / rétablir l'accès web d'un appareil
  description: >-
    Coupe ou rétablit l'accès internet d'un appareil précis, quel que soit
    son profil de contrôle parental actuel. Si l'appareil n'est couvert par
    aucun profil, un profil dédié est créé automatiquement (préfixé "[HA] ")
    pour le gérer. Si l'appareil appartient déjà à un profil couvrant
    plusieurs appareils, cette action bascule tout le profil (donc aussi les
    autres appareils qu'il couvre).
  fields:
    entity_id:
      name: Appareil
      description: >-
        N'importe quelle entité de l'appareil visé (présence, verrou Wifi,
        capteur...).
      required: true
      selector:
        entity:
          integration: freebox_devices
    bloquer:
      name: Bloquer
      description: Coché = coupe l'accès web. Décoché = le rétablit.
      required: true
      selector:
        boolean:
